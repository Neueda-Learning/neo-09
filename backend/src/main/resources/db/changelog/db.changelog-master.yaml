# Liquibase master changelog — this service owns its schema and nothing else's.
# Add one file per change set under changes/ and include it here in order.
# Never edit an already-applied change set; add a new one.
databaseChangeLog:
  - include:
      file: db/changelog/changes/001-create-demo-showcase.yaml
  - include:
      file: db/changelog/changes/002-create-case-management-core.yaml
  - include:
      file: db/changelog/changes/003-complete-uc00-intake-schema.yaml
  - include:
      file: db/changelog/changes/004-use-json-types-for-case-config.yaml
  - include:
      file: db/changelog/changes/005-align-breached-boolean-type.yaml
  - include:
      file: db/changelog/changes/006-uc03-transition-columns.yaml
  - include:
      file: db/changelog/changes/007-align-callback-sent-boolean-type.yaml
